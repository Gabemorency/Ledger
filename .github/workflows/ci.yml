name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Read-only token; no job needs to write to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to full commit SHAs; Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Every screen must render exactly like e2e/baseline.json.
      - run: npx playwright install --with-deps chromium
      - name: Screen regression check
        run: |
          npx next start -p 3000 &
          curl -sf --retry 30 --retry-connrefused --retry-delay 1 -o /dev/null http://localhost:3000
          npm run e2e -- http://localhost:3000
